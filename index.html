<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Redline Service – Mobile LKW Diagnose NRW</title>
  <meta name="description" content="Mobile LKW Diagnose, Fehleranalyse und schnelle Hilfe für Nutzfahrzeuge und Speditionen. NRW & Umgebung. Auch Samstag und Sonntag erreichbar.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      overflow-x:hidden;
    }

    .wrapper{
      width:100%;
      max-width:650px;
      margin:auto;
      padding:40px 28px 80px;
    }

    h1{
      font-size:120px;
      line-height:0.9;
      font-weight:900;
      margin-bottom:40px;
      letter-spacing:-4px;
    }

    .red{
      color:#ff1a1a;
      display:block;
    }

    .white{
      color:#fff;
      display:block;
    }

    .hero-box{
      position:relative;
      width:100%;
      min-height:720px;
      border-radius:28px;
      overflow:hidden;
      padding:50px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background:
      linear-gradient(to bottom,
      rgba(0,0,0,0.35),
      rgba(0,0,0,0.80)),
      url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
      box-shadow:0 0 40px rgba(255,0,0,0.15);
    }

    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(
      to bottom,
      rgba(0,0,0,0.15),
      rgba(0,0,0,0.82)
      );
    }

    .content{
      position:relative;
      z-index:2;
    }

    .hero-text{
      font-size:42px;
      line-height:1.25;
      font-weight:500;
      max-width:90%;
      margin-top:40px;
      text-shadow:0 3px 10px rgba(0,0,0,0.7);
    }

    .button{
      position:relative;
      z-index:2;
      margin-top:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:12px;
      width:100%;
      padding:28px 30px;
      border-radius:26px;
      text-decoration:none;
      background:linear-gradient(135deg,#ff0000,#ff2d2d);
      color:#fff;
      font-size:34px;
      font-weight:800;
      transition:0.3s;
      box-shadow:0 15px 35px rgba(255,0,0,0.35);
    }

    .button:hover{
      transform:translateY(-3px);
    }

    .infos{
      position:relative;
      z-index:2;
      margin-top:55px;
      display:flex;
      flex-direction:column;
      gap:24px;
      font-size:30px;
      line-height:1.4;
    }

    .info-item{
      display:flex;
      align-items:flex-start;
      gap:16px;
    }

    .footer{
      margin-top:50px;
      text-align:center;
      color:#777;
      font-size:16px;
    }

    /* ========================= */
    /* MOBILE OPTIMIERUNG */
    /* ========================= */

    @media (max-width: 768px){

      .wrapper{
        padding:28px 18px 60px;
      }

      h1{
        font-size:74px;
        line-height:0.9;
        letter-spacing:-2px;
        margin-bottom:28px;
      }

      .hero-box{
        min-height:auto;
        padding:28px 22px 34px;
        border-radius:22px;
      }

      .hero-text{
        font-size:26px;
        line-height:1.35;
        max-width:100%;
        margin-top:20px;
      }

      .button{
        margin-top:28px;
        font-size:24px;
        padding:22px 16px;
        border-radius:18px;
      }

      .infos{
        margin-top:35px;
        gap:18px;
        font-size:22px;
      }

      .footer{
        font-size:14px;
      }
    }

    @media (max-width: 430px){

      h1{
        font-size:60px;
      }

      .hero-text{
        font-size:22px;
      }

      .button{
        font-size:20px;
        padding:20px 14px;
      }

      .infos{
        font-size:20px;
      }
    }

  </style>
</head>

<body>

  <div class="wrapper">

    <h1>
      <span class="red">Redline</span>
      <span class="white">Service</span>
    </h1>

    <div class="hero-box">

      <div class="overlay"></div>

      <div class="content">

        <div class="hero-text">
          Mobile Diagnose, Fehleranalyse und schnelle Hilfe für LKW,
          Nutzfahrzeuge und Speditionen.
        </div>

        <a class="button"
           href="https://wa.me/4915567141137"
           target="_blank">

          💬 Jetzt per WhatsApp anfragen
        </a>

        <div class="infos">

          <div class="info-item">
            📍 Einsatzgebiet NRW & Umgebung
          </div>

          <div class="info-item">
            📞 +49 155 67141137
          </div>

          <div class="info-item">
            🚨 Auch Samstag & Sonntag erreichbar
          </div>

          <div class="info-item">
            🔧 Fehleranalyse • Diagnose • Regeneration • Fehlerspeicher
          </div>

        </div>

      </div>
    </div>

    <div class="footer">
      Redline Service
    </div>

  </div>

</body>
</html>
